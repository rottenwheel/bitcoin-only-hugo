<head>
	<meta charset="UTF-8" />
	<title>{{ with .Title }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}</title>
	<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }}" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	{{ hugo.Generator }}

	<link rel="icon" type="image/png" href="{{ "favicon.png" | relURL }}" />
	<link rel="preconnect" href="https://fonts.gstatic.com" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" />

	{{ $css := resources.Get "css/main.scss" | css.Sass | minify | fingerprint }}
	<link rel="stylesheet" href="{{ $css.RelPermalink }}" />

	<meta property="og:title" content="{{ with .Title }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}" />
	<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}Bitcoin only resources including meetups, books, wallets, podcasts, conferences, and much more.{{ end }}" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="{{ .Permalink }}" />
	<meta property="og:image" content="{{ "og-image.png" | absURL }}" />
	<meta property="og:image:width" content="800" />
	<meta property="og:image:height" content="418" />
	<meta property="og:site_name" content="{{ .Site.Title }}" />

	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="{{ with .Title }}{{ . }}{{ else }}{{ .Site.Title }}{{ end }}" />
	<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}Bitcoin only resources including meetups, books, wallets, podcasts, conferences, and much more.{{ end }}" />
</head>
